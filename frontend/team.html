<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Team | JAN SETU</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>

<body>

<div class="app">

  <!-- ================= SIDEBAR ================= -->

  <aside class="sidebar" id="sidebar">

    <a href="index.html" class="sidebar-logo">
      <img src="assets/jansetu-logo.jpg" alt="JAN SETU">
    </a>

    <button
      class="sidebar-toggle"
      id="sidebarToggle"
      type="button"
      aria-label="Toggle sidebar"
    >
      <i class="fa-solid fa-angles-left"></i>
    </button>

    <nav class="sidebar-nav" aria-label="Main navigation">

      <a href="index.html" class="nav-item" data-nav="home">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>

      <a href="#" class="nav-item" id="aiMatchesNav" data-nav="matches">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>AI Matches</span>
      </a>

      <a href="projects.html" class="nav-item" data-nav="projects">
        <i class="fa-regular fa-folder-open"></i>
        <span>Projects</span>
      </a>

      <a href="team.html" class="nav-item active" data-nav="team">
        <i class="fa-solid fa-users"></i>
        <span>Team</span>
      </a>

      <a href="solver-profile.html" class="nav-item" data-nav="profile">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
      </a>

      <a href="settings.html" class="nav-item" data-nav="settings">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
      </a>

    </nav>

    <div class="sidebar-landscape">
      <p>
        A STRONGER<br>
        JHARKHAND<br>
        TOGETHER
      </p>
    </div>

  </aside>


  <!-- ================= MAIN ================= -->

  <main class="main solver-page">

    <header class="page-header">

      <div>

        <h1>Team</h1>

        <p>
          Students, Researchers and Industry Mentors working on your projects.
        </p>

      </div>

      <div
        class="team-count"
        id="teamCount"
      >
        0 Projects
      </div>

    </header>


    <section id="teamContent"></section>

  </main>

</div>


<!-- ================= MEMBER PROFILE MODAL ================= -->

<div class="modal" id="memberModal">

  <div class="solver-profile-modal">

    <button
      class="modal-close"
      id="memberModalClose"
      type="button"
      aria-label="Close member profile"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>


    <div class="solver-profile-modal-head">

      <div
        class="member-avatar"
        id="memberModalAvatar"
      >
        M
      </div>


      <div>

        <h2 id="memberModalName"></h2>

        <p id="memberModalRole"></p>

      </div>

    </div>


    <div
      id="memberModalBody"
      class="profile-modal-details"
    ></div>

  </div>

</div>


<script>

/* =========================================================
   ROLE LABELS
   ========================================================= */

const roleLabels = {
  student: "Student",
  researcher: "Researcher",
  startup: "Startup",
  company: "Company",
  msme: "MSME",
  csr: "CSR",
  "research-lab": "Research Lab",
  "innovation-hub": "Innovation Hub"
};


const role =
  localStorage.getItem("solverRole") || "student";


const accountId =
  localStorage.getItem("solverAccountId");


/* =========================================================
   DOM
   ========================================================= */

const sidebar =
  document.getElementById("sidebar");

const sidebarToggle =
  document.getElementById("sidebarToggle");

const teamCount =
  document.getElementById("teamCount");

const teamContent =
  document.getElementById("teamContent");


const memberModal =
  document.getElementById("memberModal");

const memberModalClose =
  document.getElementById("memberModalClose");

const memberModalName =
  document.getElementById("memberModalName");

const memberModalAvatar =
  document.getElementById("memberModalAvatar");

const memberModalRole =
  document.getElementById("memberModalRole");

const memberModalBody =
  document.getElementById("memberModalBody");


/* =========================================================
   NAVIGATION
   ========================================================= */

function setRoleAwareNavigation() {

  const matchesLink =
    document.getElementById("aiMatchesNav");

  if (!matchesLink) return;

  matchesLink.href =
    (role === "student" || role === "researcher")
      ? "ai-matches-student.html"
      : "ai-matches-industry.html";
}


/* =========================================================
   HELPERS
   ========================================================= */

function safeText(value, fallback = "") {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return fallback;
  }

  return String(value);
}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function getInitial(name) {

  const text =
    safeText(name, "M").trim();

  return text
    ? text.charAt(0).toUpperCase()
    : "M";
}


function formatRole(role) {

  return roleLabels[role]
    || role
    || "Member";
}


/* =========================================================
   MEMBER MODAL
   ========================================================= */

function openMember(member) {

  if (!member) return;


  const name =
    safeText(
      member.full_name,
      "Member"
    );


  const memberRole =
    formatRole(member.role);


  memberModalName.textContent =
    name;


  memberModalAvatar.textContent =
    getInitial(name);


  memberModalRole.textContent =
    memberRole;


  const email =
    safeText(
      member.email,
      "Email unavailable"
    );


  memberModalBody.innerHTML = `

    <div>

      <span>Email</span>

      <strong>
        ${escapeHTML(email)}
      </strong>

    </div>


    <div>

      <span>Role</span>

      <strong>
        ${escapeHTML(memberRole)}
      </strong>

    </div>


    <div>

      <span>Account ID</span>

      <strong>
        ${escapeHTML(member.account_id)}
      </strong>

    </div>

  `;


  memberModal.classList.add("show");

  memberModalClose.focus();
}


function closeMemberModal() {

  memberModal.classList.remove("show");
}


/* =========================================================
   LOADING
   ========================================================= */

function renderLoading() {

  teamContent.innerHTML = `

    <div class="solver-empty">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <h2>Loading teams...</h2>

      <p>
        Fetching your active JAN SETU projects.
      </p>

    </div>

  `;

}


/* =========================================================
   EMPTY
   ========================================================= */

function renderEmpty() {

  teamCount.textContent =
    "0 Projects";


  teamContent.innerHTML = `

    <div class="solver-empty">

      <i class="fa-solid fa-users"></i>

      <h2>No active teams</h2>

      <p>
        You are not currently part of any active JAN SETU project.
      </p>

      <a
        href="projects.html"
        class="solver-primary-link"
      >
        View Projects
      </a>

    </div>

  `;

}


/* =========================================================
   ERROR
   ========================================================= */

function renderError() {

  teamCount.textContent =
    "Unable to load";


  teamContent.innerHTML = `

    <div class="solver-empty">

      <i class="fa-solid fa-triangle-exclamation"></i>

      <h2>Unable to load teams</h2>

      <p>
        We couldn't retrieve your team information.
        Please make sure the backend is running and try again.
      </p>

      <button
        type="button"
        class="solver-primary-link"
        onclick="loadTeams()"
      >
        Try Again
      </button>

    </div>

  `;

}


/* =========================================================
   MEMBER CARD
   ========================================================= */

function createMemberCard(member) {

  const card =
    document.createElement("article");


  card.className =
    "team-member-card";


  const name =
    safeText(
      member.full_name,
      "Member"
    );


  const memberRole =
    formatRole(member.role);


  const email =
    safeText(
      member.email,
      "Email unavailable"
    );


  const isMentor =
    member.role === "company";


  card.innerHTML = `

    <div class="member-avatar">
      ${escapeHTML(getInitial(name))}
    </div>


    <div class="team-member-info">

      <span class="member-type">
        ${escapeHTML(memberRole)}
      </span>

      <h3>
        ${escapeHTML(name)}
      </h3>

      <p>
        ${escapeHTML(email)}
      </p>

    </div>


    <div class="member-actions">

      <button
        class="view-member-btn"
        type="button"
      >
        View Profile
      </button>

    </div>

  `;


  const viewButton =
    card.querySelector(
      ".view-member-btn"
    );


  viewButton.addEventListener(
    "click",
    () => openMember(member)
  );


  return card;
}


/* =========================================================
   PROJECT TEAM
   ========================================================= */

function renderProjectTeam(project) {

  const members =
    Array.isArray(project.members)
      ? project.members
      : [];


  const students =
    members.filter(member =>
      member &&
      (
        member.role === "student" ||
        member.role === "researcher"
      )
    );


  const mentors =
    members.filter(member =>
      member &&
      member.role === "company"
    );


  const studentCount =
    Number.isFinite(project.student_count)
      ? project.student_count
      : students.length;


  const mentorCount =
    Number.isFinite(project.mentor_count)
      ? project.mentor_count
      : mentors.length;


  const maxStudents =
    Number.isFinite(project.max_students)
      ? project.max_students
      : 4;


  const maxMentors =
    Number.isFinite(project.max_mentors)
      ? project.max_mentors
      : 2;


  const projectWrapper =
    document.createElement("div");


  projectWrapper.className =
    "team-project-wrapper";


  /* =======================================================
     PROJECT BANNER
     ======================================================= */

  const banner =
    document.createElement("div");


  banner.className =
    "team-project-banner";


  banner.innerHTML = `

    <div>

      <span>
        ${escapeHTML(
          project.workflow_status === "SOLVED"
            ? "SOLVED PROJECT"
            : "ACTIVE PROJECT"
        )}
      </span>

      <h2>
        ${escapeHTML(
          project.title ||
          "Untitled Project"
        )}
      </h2>

      <p>
        <i class="fa-solid fa-location-dot"></i>
        ${escapeHTML(
          project.location ||
          project.district ||
          "Jharkhand"
        )}
      </p>

    </div>

  `;


  projectWrapper.appendChild(banner);


  /* =======================================================
     PROJECT META
     ======================================================= */

  const meta =
    document.createElement("div");


  meta.className =
    "public-problem-meta";


  meta.innerHTML = `

    <span>

      <i class="fa-solid fa-layer-group"></i>

      ${escapeHTML(
        project.category ||
        "Civic Problem"
      )}

    </span>


    <span>

      <i class="fa-solid fa-user-graduate"></i>

      ${studentCount}/${maxStudents}
      Students

    </span>


    <span>

      <i class="fa-solid fa-building"></i>

      ${mentorCount}/${maxMentors}
      Mentors

    </span>

  `;


  projectWrapper.appendChild(meta);


  /* =======================================================
     TEAM GRID
     ======================================================= */

  const grid =
    document.createElement("div");


  grid.className =
    "team-grid";


  /* ================= STUDENTS ================= */

  students.forEach(member => {

    grid.appendChild(
      createMemberCard(member)
    );

  });


  /* ================= MENTORS ================= */

  mentors.forEach(member => {

    const card =
      createMemberCard(member);


    card.classList.add(
      "mentor-card"
    );


    const type =
      card.querySelector(
        ".member-type"
      );


    if (type) {
      type.textContent =
        "Industry Mentor";
    }


    grid.appendChild(card);

  });


  /* ================= NO MEMBERS ================= */

  if (!members.length) {

    const empty =
      document.createElement("div");


    empty.className =
      "team-inline-empty";


    empty.innerHTML = `

      <p>
        No team members found for this project.
      </p>

    `;


    grid.appendChild(empty);

  }


  projectWrapper.appendChild(grid);


  /* =======================================================
     DESCRIPTION
     ======================================================= */

  if (project.description) {

    const description =
      document.createElement("div");


    description.className =
      "team-project-description";


    description.innerHTML = `

      <span>
        PROJECT DESCRIPTION
      </span>

      <p>
        ${escapeHTML(project.description)}
      </p>

    `;


    projectWrapper.appendChild(
      description
    );

  }


  teamContent.appendChild(
    projectWrapper
  );

}


/* =========================================================
   LOAD TEAMS
   ========================================================= */

async function loadTeams() {

  if (!accountId) {

    renderError();

    teamContent.innerHTML = `

      <div class="solver-empty">

        <i class="fa-solid fa-user-lock"></i>

        <h2>Solver login required</h2>

        <p>
          Please log in to view your teams.
        </p>

        <a
          href="solver-login.html"
          class="solver-primary-link"
        >
          Go to Solver Login
        </a>

      </div>

    `;

    return;
  }


  renderLoading();


  try {

    /*
     * Relative API URL.
     *
     * Works locally and on Render.
     */

    const response =
      await fetch(
        `/api/projects?account_id=${encodeURIComponent(accountId)}`
      );


    if (!response.ok) {

      throw new Error(
        `Server returned ${response.status}`
      );

    }


    const data =
      await response.json();


    const projects =
      Array.isArray(data.projects)
        ? data.projects
        : [];


    if (!projects.length) {

      renderEmpty();

      return;

    }


    teamContent.innerHTML = "";


    teamCount.textContent =
      `${projects.length} ${
        projects.length === 1
          ? "Project"
          : "Projects"
      }`;


    projects.forEach(
      renderProjectTeam
    );


  } catch (error) {

    console.error(
      "Failed to load teams:",
      error
    );


    renderError();

  }

}


/* =========================================================
   MODAL EVENTS
   ========================================================= */

memberModalClose.addEventListener(
  "click",
  closeMemberModal
);


memberModal.addEventListener(
  "click",
  event => {

    if (
      event.target === memberModal
    ) {
      closeMemberModal();
    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      memberModal.classList.contains("show")
    ) {

      closeMemberModal();

    }

  }
);


/* =========================================================
   SIDEBAR
   ========================================================= */

sidebarToggle.addEventListener(
  "click",
  () => {

    const collapsed =
      sidebar.classList.toggle(
        "collapsed"
      );


    document
      .querySelector(".app")
      .classList.toggle(
        "sidebar-collapsed"
      );


    sidebarToggle.setAttribute(
      "aria-expanded",
      String(!collapsed)
    );

  }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

setRoleAwareNavigation();

loadTeams();

</script>

</body>
</html>
