<!-- Phone verification card -->
<main class="otp-page">
    <div class="otp-card">

        <p class="otp-label">REPORT A PROBLEM</p>

        <h1>
            Verify your phone <span>number</span>
        </h1>

        <p class="otp-text">
            Enter your phone number to receive an OTP.
        </p>

        <!-- Phone input -->
        <div class="phone-box">
            <span aria-hidden="true">🇮🇳 +91 </span>

            <input
                type="tel"
                id="phone"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
                placeholder="98XXX XXXXX"
                aria-label="10-digit phone number"
            >
        </div>

        <!-- SMS is default -->
        <button id="smsBtn" class="sms-btn" type="button">
            Send OTP via SMS
        </button>

        <p class="or-text">OR</p>

        <!-- WhatsApp alternative -->
        <button id="whatsappBtn" class="whatsapp-btn" type="button">
            Use WhatsApp Instead
        </button>

        <p class="safe-text">
            Your number will only be used for verification.
        </p>

    </div>
</main>

<!-- Background image -->
<div class="otp-landscape"></div>

<script>
    // Reporting always starts with phone verification in the prototype.
    // Tracking from the public problem list uses only the private Track ID.
    const params = new URLSearchParams(window.location.search);
    const allowedReturnPages = ["report.html"];
    const requestedReturnTo = params.get("returnTo");
    const returnTo = allowedReturnPages.includes(requestedReturnTo)
        ? requestedReturnTo
        : "report.html";

    localStorage.setItem("reporterReturnTo", returnTo);

    // Get input and buttons
    const phone = document.getElementById("phone");
    const smsBtn = document.getElementById("smsBtn");
    const whatsappBtn = document.getElementById("whatsappBtn");

    // Keep only numeric characters.
    phone.addEventListener("input", function () {
        phone.value = phone.value.replace(/\D/g, "").slice(0, 10);
    });

    // Check if phone number is valid
    function validPhone() {
        const number = phone.value.replace(/\D/g, "");

        if (number.length !== 10) {
            alert("Enter a valid 10-digit phone number.");
            phone.focus();
            return false;
        }

        return true;
    }

    // SMS OTP
    smsBtn.addEventListener("click", function () {
        if (!validPhone()) return;

        localStorage.setItem("phone", phone.value);
        localStorage.setItem("otpMethod", "sms");

        window.location.href = "verify-otp.html";
    });

    // WhatsApp OTP
    whatsappBtn.addEventListener("click", function () {
        if (!validPhone()) return;

        localStorage.setItem("phone", phone.value);
        localStorage.setItem("otpMethod", "whatsapp");

        window.location.href = "verify-otp.html";
    });
</script>
