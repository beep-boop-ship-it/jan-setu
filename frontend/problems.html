<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | JAN SETU</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <a href="index.html" class="sidebar-logo">
      <img src="assets/jansetu-logo.jpg" alt="JAN SETU">
    </a>

    <button
      class="sidebar-toggle"
      id="sidebarToggle"
      type="button"
      aria-label="Toggle sidebar">
      <i class="fa-solid fa-angles-left"></i>
    </button>

    <nav class="sidebar-nav" aria-label="Main navigation">

      <a href="index.html" class="nav-item" data-nav="home">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>

      <a href="#" class="nav-item" id="aiMatchesNav" data-nav="matches">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>AI Matches</span>
      </a>

      <a href="projects.html" class="nav-item active" data-nav="projects">
        <i class="fa-regular fa-folder-open"></i>
        <span>Projects</span>
      </a>

      <a href="team.html" class="nav-item" data-nav="team">
        <i class="fa-solid fa-users"></i>
        <span>Team</span>
      </a>

      <a href="solver-profile.html" class="nav-item" data-nav="profile">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
      </a>

      <a href="settings.html" class="nav-item" data-nav="settings">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
      </a>

    </nav>

    <div class="sidebar-landscape">
      <p>
        A STRONGER<br>
        JHARKHAND<br>
        TOGETHER
      </p>
    </div>

  </aside>


  <main class="main solver-page">

    <header class="page-header">
      <div>
        <h1>Projects</h1>
        <p>Your active JAN SETU projects and their working teams.</p>
      </div>
    </header>


    <section id="projectsContent" class="solver-content-list"></section>

  </main>

</div>


<script>

const API_BASE =
  (window.location.hostname === "localhost" ||
   window.location.hostname === "127.0.0.1" ||
   window.location.protocol === "file:")
    ? "http://localhost:8080"
    : "";

const roleLabels = {
  student: "Student",
  researcher: "Researcher",
  startup: "Startup",
  company: "Company",
  msme: "MSME",
  csr: "CSR",
  "research-lab": "Research Lab",
  "innovation-hub": "Innovation Hub"
};


const storedRole = localStorage.getItem("solverRole");

const role = roleLabels[storedRole]
  ? storedRole
  : "student";


const accountId = localStorage.getItem("solverAccountId");


const sidebar = document.getElementById("sidebar");
const sidebarToggle = document.getElementById("sidebarToggle");
const content = document.getElementById("projectsContent");


function setRoleAwareNavigation() {

  const matchesLink = document.getElementById("aiMatchesNav");

  if (!matchesLink) return;

  matchesLink.href =
    (role === "student" || role === "researcher")
      ? "ai-matches-student.html"
      : "ai-matches-industry.html";
}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function emptyState(message, href, label) {

  content.innerHTML = `
    <div class="solver-empty">

      <i class="fa-regular fa-folder-open"></i>

      <h2>No projects yet</h2>

      <p>
        ${escapeHTML(message)}
      </p>

      <a
        href="${escapeHTML(href)}"
        class="solver-primary-link">
        ${escapeHTML(label)}
      </a>

    </div>
  `;
}


function loadingState() {

  content.innerHTML = `
    <div class="solver-empty">

      <i class="fa-solid fa-spinner fa-spin"></i>

      <h2>Loading projects...</h2>

      <p>
        Fetching your active JAN SETU projects.
      </p>

    </div>
  `;
}


function errorState(message) {

  content.innerHTML = `
    <div class="solver-empty">

      <i class="fa-solid fa-triangle-exclamation"></i>

      <h2>Unable to load projects</h2>

      <p>
        ${escapeHTML(message)}
      </p>

      <button
        type="button"
        class="solver-primary-link"
        onclick="loadProjects()">
        Try Again
      </button>

    </div>
  `;
}


function formatRole(role) {

  return roleLabels[role] || role || "Member";
}


function renderMember(member) {

  const role = formatRole(member.role);

  return `
    <div class="project-member">

      <div class="project-member-avatar">
        <i class="fa-solid fa-user"></i>
      </div>

      <div class="project-member-info">

        <strong>
          ${escapeHTML(member.full_name || "Unnamed Member")}
        </strong>

        <span>
          ${escapeHTML(member.email || "Email unavailable")}
        </span>

      </div>

      <span class="status-pill verified">
        ${escapeHTML(role)}
      </span>

    </div>
  `;
}


function renderProject(project) {

  const members = Array.isArray(project.members)
    ? project.members
    : [];

  const memberHTML = members.length
    ? members.map(renderMember).join("")
    : `
      <p>
        No team members found.
      </p>
    `;


  const status =
    project.workflow_status === "SOLVED"
      ? "Solved"
      : "In Progress";


  const statusClass =
    project.workflow_status === "SOLVED"
      ? "verified"
      : "in-progress";


  const card = document.createElement("article");

  card.className = "solver-project-card active-project-card";


  card.innerHTML = `

    <div>

      <span class="status-pill ${statusClass}">
        ${escapeHTML(status)}
      </span>

      <h2>
        ${escapeHTML(project.title || "Untitled Project")}
      </h2>

      <p>
        ${escapeHTML(
          project.description ||
          "No project description available."
        )}
      </p>


      <div class="public-problem-meta">

        <span>
          <i class="fa-solid fa-layer-group"></i>
          ${escapeHTML(project.category || "Civic Problem")}
        </span>

        <span>
          <i class="fa-solid fa-location-dot"></i>
          ${escapeHTML(project.location || "Location not set")}
        </span>

        <span>
          <i class="fa-solid fa-users"></i>
          ${project.team_size || 0}/${project.max_team_size || 4}
          team members
        </span>

      </div>


      <div class="project-team-preview">

        <h3>
          <i class="fa-solid fa-users"></i>
          Working Team
        </h3>

        <div class="project-members-list">

          ${memberHTML}

        </div>

      </div>

    </div>


    <a
      href="team.html"
      class="solver-primary-link">
      View Team
    </a>

  `;


  content.appendChild(card);
}


async function loadProjects() {

  if (!accountId) {

    emptyState(
      "Please log in as a solver to view your projects.",
      "solver-login.html",
      "Go to Solver Login"
    );

    return;
  }


  loadingState();


  try {

    const response = await fetch(
      `${API_BASE}/api/projects?account_id=${encodeURIComponent(accountId)}`
    );


    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(
        errorText || `Server returned ${response.status}`
      );
    }


    const data = await response.json();


    const projects =
      Array.isArray(data.projects)
        ? data.projects
        : [];


    content.innerHTML = "";


    if (!projects.length) {

      emptyState(
        "You are not currently working on any JAN SETU problems.",
        "ai-matches-student.html",
        "Explore AI Matches"
      );

      return;
    }


    projects.forEach(renderProject);


  } catch (error) {

    console.error("Failed to load projects:", error);

    errorState(
      "We couldn't retrieve your projects from the server. " +
      "Please make sure the backend is running and try again."
    );

  }

}


setRoleAwareNavigation();


sidebarToggle.addEventListener("click", () => {

  const collapsed =
    sidebar.classList.toggle("collapsed");

  document
    .querySelector(".app")
    .classList.toggle(
      "sidebar-collapsed"
    );

  sidebarToggle.setAttribute(
    "aria-expanded",
    String(!collapsed)
  );

});


loadProjects();

</script>

</body>
</html>
