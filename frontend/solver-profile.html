<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | JAN SETU</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
  .category-select { position: relative; width: 100%; }
  .category-select-trigger {
    width: 100%; min-height: 52px; padding: 12px 44px 12px 16px;
    border: 1px solid #d9e2e8; border-radius: 10px; background: #fff;
    color: #526274; font: inherit; text-align: left; cursor: pointer; position: relative;
    box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .category-select-trigger::after {
    content: "\f078"; font-family: "Font Awesome 6 Free"; font-weight: 900;
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  }
  .category-select.open .category-select-trigger::after { transform: translateY(-50%) rotate(180deg); }
  .category-select-menu {
    display: none; position: absolute; z-index: 50; left: 0; right: 0; top: calc(100% + 6px);
    max-height: 240px; overflow-y: auto; padding: 6px; background: #fff;
    border: 1px solid #d9e2e8; border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.10);
  }
  .category-select.open .category-select-menu { display: block; }
  .category-select-menu .category-option {
    display: flex !important; align-items: center !important; gap: 10px !important;
    width: 100% !important; min-height: 38px; margin: 0 !important; padding: 9px 10px !important;
    border-radius: 7px; cursor: pointer; color: #526274 !important; font-size: 14px;
    font-weight: 400 !important; line-height: 1.4; box-sizing: border-box;
    position: static !important; text-align: left !important;
  }
  .category-select-menu .category-option:hover { background: #f4f8f6; }
  .category-select-menu .category-option input {
    width: 16px !important; height: 16px !important; min-width: 16px; margin: 0 !important;
    padding: 0 !important; accent-color: #278354; flex: 0 0 16px; position: static !important;
  }
  .category-select-menu .category-option span {
    display: inline !important; position: static !important; margin: 0 !important; padding: 0 !important;
    color: #526274 !important; font-size: 14px; font-weight: 400 !important;
    line-height: 1.4; text-align: left !important;
  }
  .category-option.disabled { opacity: .5; cursor: not-allowed; }
  .category-selected-count { margin-top: 6px; color: #718096; font-size: 13px; }
  .category-selected-count.limit { color: #278354; font-weight: 600; }
  .category-placeholder { color: #718096; }
</style>
</head>
<body>

<div class="profile-app">
  <!-- ================= SOLVER SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo"><img src="assets/jansetu-logo.jpg" alt="JAN SETU"></a>
    <button class="sidebar-toggle" id="sidebarToggle" type="button"><i class="fa-solid fa-angles-left"></i></button>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item" data-nav="home">
        <i class="fa-solid fa-house"></i><span>Home</span>
      </a>
      <a href="#" class="nav-item" id="aiMatchesNav" data-nav="matches">
        <i class="fa-solid fa-wand-magic-sparkles"></i><span>AI Matches</span>
      </a>
      <a href="projects.html" class="nav-item" data-nav="projects">
        <i class="fa-regular fa-folder-open"></i><span>Projects</span>
      </a>
      <a href="team.html" class="nav-item" data-nav="team">
        <i class="fa-solid fa-users"></i><span>Team</span>
      </a>
      <a href="solver-profile.html" class="nav-item active" data-nav="profile">
        <i class="fa-solid fa-user"></i><span>Profile</span>
      </a>

        <i class="fa-solid fa-gear"></i><span>Settings</span>
      </a>
    </nav>
  </aside>

  <main class="main">
    <header class="page-header">
      <div>
        <h1 id="pageTitle">Your Profile</h1>
        <p>Keep your profile updated to get better opportunities and collaborations.</p>
      </div>
      <div class="mini-profile">
        <div class="mini-avatar" id="miniAvatar">A</div>
        <div><strong id="miniName">Your Name</strong><span id="miniRole">Student</span></div>
      </div>
    </header>

<section class="profile-card" id="profileCard">
  <div class="tabs">
    <button class="tab active" type="button" data-target="personal">Personal Information</button>
    <button class="tab" type="button" data-target="education">Education & Skills</button>
    <button class="tab" type="button" data-target="projects">Projects & Interests</button>
    <button class="tab" type="button" data-target="additional">Additional Info</button>
  </div>

  <div id="personal" class="profile-section">
    <div class="photo-row">
      <div class="profile-photo" id="profilePhoto">
        <i class="fa-solid fa-user"></i>
        <label for="photoInput" class="camera-btn"><i class="fa-solid fa-camera"></i></label>
      </div>
      <div>
        <h3>Profile Photo</h3>
        <button class="outline-btn" id="uploadPhotoBtn" type="button"><i class="fa-solid fa-arrow-up-from-bracket"></i> Upload Photo</button>
        <small>JPG, PNG. Small images can be saved in this frontend demo.</small>
      </div>
      <input type="file" id="photoInput" accept="image/png,image/jpeg" hidden>
    </div>

    <div class="two-col">
      <div class="field">
        <label id="nameLabel" for="fullName">Full Name <span>*</span></label>
        <input type="text" id="fullName" placeholder="Enter your name">
      </div>
      <div class="field">
        <label>Role</label>
        <div class="readonly"><i class="fa-regular fa-user"></i><span id="roleDisplay">Student</span></div>
      </div>
    </div>
  </div>

  <div id="education" class="profile-section">
    <div id="dynamicFields" class="two-col"></div>
  </div>

  <div id="projects" class="profile-section">
    <div class="two-col">
      <div class="field">
        <label for="profileLocation">Location <span>*</span></label>
        <input type="text" id="profileLocation" placeholder="City, State">
      </div>
      <div class="field">
        <label for="linkedin">LinkedIn (Optional)</label>
        <input type="url" id="linkedin" placeholder="https://linkedin.com/in/...">
      </div>
    </div>
    <div class="field wide-field">
      <label for="about">Bio <span>*</span></label>
      <div class="textarea-wrap">
        <textarea id="about" maxlength="500" placeholder="Tell us about yourself, your goals and interests..."></textarea>
        <small id="aboutCount">0/500</small>
      </div>
    </div>
  </div>

  <div id="additional" class="profile-section">
    <label class="consent" id="consentBox">
      <input type="checkbox" id="contactConsent">
      <span>If selected for a project, I agree that my contact number may be shared with the assigned mentor / organization.</span>
    </label>

    <div class="actions">
      <button class="cancel-btn" id="cancelEditBtn" type="button">Cancel</button>
      <button class="save-btn" type="button" id="profileActionBtn"><i class="fa-regular fa-floppy-disk"></i> Save Profile</button>
    </div>
  </div>
</section>

  </main>
</div>

<script>
const API_BASE =
  (window.location.hostname === "localhost" ||
   window.location.hostname === "127.0.0.1")
    ? window.location.origin
    : "https://jan-setu-bf03.onrender.com";

const validRoles = [
  "student",
  "researcher",
  "startup",
  "company",
  "msme",
  "csr",
  "research-lab",
  "innovation-hub"
];

let accountId = localStorage.getItem("solverAccountId");
accountId = accountId ? accountId.trim() : "";

const isValidAccountId =
  /^\d+$/.test(accountId) && Number(accountId) > 0;

if (!isValidAccountId) {
  localStorage.removeItem("solverProfileCompleted");
  alert("Please log in to access your profile.");
  window.location.href = "solver-login.html";
  throw new Error("Missing or invalid solverAccountId.");
}

let account = {};
try {
  account = JSON.parse(localStorage.getItem("solverAccount") || "{}");
} catch {
  account = {};
}

const storedRole = localStorage.getItem("solverRole");
const role =
  validRoles.includes(account.role)
    ? account.role
    : validRoles.includes(storedRole)
      ? storedRole
      : "student";

const sidebar = document.getElementById("sidebar");
const sidebarToggle = document.getElementById("sidebarToggle");
const roleDisplay = document.getElementById("roleDisplay");
const miniRole = document.getElementById("miniRole");
const miniName = document.getElementById("miniName");
const miniAvatar = document.getElementById("miniAvatar");
const profilePhoto = document.getElementById("profilePhoto");
const aboutCount = document.getElementById("aboutCount");
const pageTitle = document.getElementById("pageTitle");

const roleLabels = {
  student: "Student",
  researcher: "Researcher",
  startup: "Startup",
  company: "Company",
  msme: "MSME",
  csr: "CSR",
  "research-lab": "Research Lab",
  "innovation-hub": "Innovation Hub"
};

const roleData = {
  student: {fields:[
    ["University / HEI Name","e.g. NSUT, IIT Delhi, BIT Mesra"],
    ["Official University Email","e.g. name@university.ac.in"],
    ["Enrollment / Student ID","Enter your enrollment ID"],
    ["Department / Branch","e.g. Computer Science and Engineering"],
    ["Year of Study","e.g. 2nd Year"],
    ["Skills","e.g. Python, AI, Web Development"],
    ["Interests","e.g. Sustainability, Rural Development"],
    ["Projects (Optional)","Mention projects or GitHub links"]
  ]},
  researcher: {fields:[
    ["University / HEI Name","e.g. IIT Delhi, Ranchi University"],
    ["Official University Email","e.g. researcher@university.ac.in"],
    ["Researcher / Employee ID","Enter your institutional ID"],
    ["Research Domain","e.g. AI, Agriculture, Public Health"],
    ["Areas of Expertise","e.g. Computer Vision, Data Science"],
    ["Years of Experience","e.g. 5 Years"],
    ["Publications / Projects","Mention publications or projects"],
    ["Research Interests","Areas you want to work on"]
  ]},
  startup: {fields:[
    ["Industry / Domain","e.g. HealthTech, EdTech, CleanTech"],
    ["Startup Stage","e.g. MVP, Early Stage, Growth"],
    ["Core Capabilities","Technology, services or resources"],
    ["Mentor Expertise","Areas your mentor can guide in"],
    ["Deployment Experience","Relevant pilots or deployments"]
  ]},
  company: {fields:[
    ["Industry","e.g. IT, Manufacturing, Energy"],
    ["Department / Division","Relevant department"],
    ["Capabilities / Resources","Technology, facilities or support"],
    ["Mentor Expertise","Areas your mentor can guide in"],
    ["Previous Social Projects","Relevant initiatives"]
  ]},
  msme: {fields:[
    ["Business Sector","e.g. Manufacturing, Services"],
    ["Products / Services","Main products or services"],
    ["Capabilities","Implementation or support capabilities"],
    ["Mentor Expertise","Mentor's key expertise"],
    ["Operational Area","Districts / regions served"]
  ]},
  csr: {fields:[
    ["CSR Focus Areas","e.g. Education, Health, Environment"],
    ["Current Programs","Relevant CSR programs"],
    ["Type of Support","Funding, mentorship, deployment support"],
    ["Coordinator Expertise","Coordinator / mentor expertise"],
    ["Impact Areas","Regions or communities supported"]
  ]},
  "research-lab": {fields:[
    ["Research Areas","Main research domains"],
    ["Facilities / Equipment","Available facilities"],
    ["Technical Expertise","Key technical capabilities"],
    ["Validation / Testing Support","Testing support available"],
    ["Research Projects","Relevant projects or collaborations"]
  ]},
  "innovation-hub": {fields:[
    ["Focus Areas","e.g. Social Innovation, Technology"],
    ["Programs / Initiatives","Incubation or accelerator programs"],
    ["Support Offered","Mentorship, incubation, prototyping"],
    ["Mentor Expertise","Areas mentors can guide in"],
    ["Network / Partnerships","Institutions or partners connected"]
  ]}
};

const fullNameInput = document.getElementById("fullName");
const profileLocationInput = document.getElementById("profileLocation");
const linkedinInput = document.getElementById("linkedin");
const aboutInput = document.getElementById("about");
const consentInput = document.getElementById("contactConsent");
const actionBtn = document.getElementById("profileActionBtn");
const cancelBtn = document.getElementById("cancelEditBtn");
const photoInput = document.getElementById("photoInput");
const uploadPhotoBtn = document.getElementById("uploadPhotoBtn");
const profileCard = document.getElementById("profileCard");
const dynamicFields = document.getElementById("dynamicFields");

const isStudentResearcher =
  role === "student" || role === "researcher";

let isEditing = false;
let profilePhotoData = "";
let profilePhone = account.phone || "";
let hasLoadedProfile = false;
let isLoadingProfile = true;
let backendProfileSnapshot = {};

roleDisplay.textContent = roleLabels[role] || "Solver";
miniRole.textContent = roleLabels[role] || "Solver";

document.getElementById("consentBox").style.display =
  isStudentResearcher ? "flex" : "none";

document.getElementById("nameLabel").innerHTML =
  isStudentResearcher
    ? 'Full Name <span>*</span>'
    : 'Organization / Account Name <span>*</span>';

(roleData[role] || roleData.student).fields.forEach(
  ([label, placeholder], index) => {

    const wrapper = document.createElement("div");
    wrapper.className = "field";

    const optional = label.includes("Optional");
    const inputId = `role-input-${index}`;

    if (label === "Interests" || label === "Research Interests") {
      wrapper.innerHTML = `
        <label for="${inputId}-trigger">
          ${label} ${optional ? "" : "<span>*</span>"}
        </label>
        <input
          type="hidden"
          id="${inputId}"
          class="role-input category-value"
          data-label="${label}"
        >
        <div class="category-select" data-category-select data-input-id="${inputId}">
          <button type="button" class="category-select-trigger" id="${inputId}-trigger">
            <span class="category-placeholder">Select up to 5 categories</span>
          </button>
          <div class="category-select-menu"></div>
          <div class="category-selected-count">0/5 selected</div>
        </div>
      `;
    } else {
      wrapper.innerHTML = `
        <label for="${inputId}">
          ${label} ${optional ? "" : "<span>*</span>"}
        </label>
        <input
          type="text"
          id="${inputId}"
          class="role-input"
          data-label="${label}"
          placeholder="${placeholder}"
        >
        ${label === "Skills" ? '<ul id="skillsList"></ul>' : ""}
      `;
    }

    dynamicFields.appendChild(wrapper);
  }
);

const categoryOptions = [
  "Road",
  "Water",
  "Electricity",
  "Education",
  "Health",
  "Waste",
  "Sanitation",
  "Public Safety",
  "Agriculture",
  "Employment",
  "Environment",
  "Transportation",
  "Public Infrastructure",
  "Women & Child Welfare",
  "Digital Services",
  "Other"
];

function setupCategorySelect(select) {
  const input = document.getElementById(select.dataset.inputId);
  const trigger = select.querySelector(".category-select-trigger");
  const menu = select.querySelector(".category-select-menu");
  const count = select.querySelector(".category-selected-count");

  categoryOptions.forEach(category => {
    const label = document.createElement("label");
    label.className = "category-option";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = category;

    const text = document.createElement("span");
    text.textContent = category;

    label.appendChild(checkbox);
    label.appendChild(text);
    menu.appendChild(label);

    checkbox.addEventListener("change", () => {
      const selected = [...menu.querySelectorAll("input:checked")].map(item => item.value);

      if (selected.length > 5) {
        checkbox.checked = false;
        updateCategorySelect(select);
        return;
      }

      input.value = selected.join(", ");
      updateCategorySelect(select);
    });
  });

  trigger.addEventListener("click", () => {
    if (isEditing) {
      select.classList.toggle("open");
    }
  });
}

function updateCategorySelect(select) {
  const input = document.getElementById(select.dataset.inputId);
  const trigger = select.querySelector(".category-select-trigger");
  const count = select.querySelector(".category-selected-count");
  const selected = input.value.split(",").map(item => item.trim()).filter(Boolean);

  const atLimit = selected.length >= 5;

  select.querySelectorAll(".category-option").forEach(option => {
    const checkbox = option.querySelector("input");
    const checked = selected.includes(checkbox.value);

    checkbox.checked = checked;
    checkbox.disabled = atLimit && !checked;
    option.classList.toggle("disabled", checkbox.disabled);
  });

  trigger.querySelector("span").textContent =
    selected.length ? selected.join(", ") : "Select up to 5 categories";
  trigger.querySelector("span").className =
    selected.length ? "" : "category-placeholder";

  count.textContent = `${selected.length}/5 selected`;
  count.classList.toggle("limit", selected.length === 5);
}

function closeCategorySelects() {
  document.querySelectorAll("[data-category-select]").forEach(select => {
    select.classList.remove("open");
  });
}

document.addEventListener("click", event => {
  if (!event.target.closest("[data-category-select]")) {
    closeCategorySelects();
  }
});

document.querySelectorAll("[data-category-select]").forEach(setupCategorySelect);

const roleInputs =
  [...document.querySelectorAll(".role-input")];

const skillsInput =
  roleInputs.find(
    input => input.dataset.label === "Skills"
  );

const skillsList =
  document.getElementById("skillsList");

function updateSkillsList() {

  if (!skillsInput || !skillsList) return;

  skillsList.innerHTML = "";

  skillsInput.value
    .split(",")
    .map(item => item.trim())
    .filter(Boolean)
    .forEach(skill => {

      const li = document.createElement("li");
      li.textContent = skill;
      skillsList.appendChild(li);

    });
}

skillsInput?.addEventListener(
  "input",
  updateSkillsList
);

function updateMiniProfile() {

  const name =
    fullNameInput.value.trim() ||
    account.primaryName ||
    "Your Name";

  miniName.textContent = name;
  miniAvatar.textContent =
    name.charAt(0).toUpperCase() || "A";
}

fullNameInput.addEventListener(
  "input",
  updateMiniProfile
);

aboutInput.addEventListener(
  "input",
  () => {
    aboutCount.textContent =
      `${aboutInput.value.length}/500`;
  }
);

function setProfileCardLoading(loading) {
  isLoadingProfile = loading;

  profileCard.style.visibility =
    loading ? "hidden" : "visible";

  profileCard.style.pointerEvents =
    loading ? "none" : "";

  if (loading) {
    actionBtn.disabled = true;
    cancelBtn.disabled = true;
    uploadPhotoBtn.disabled = true;
    photoInput.disabled = true;
  } else {
    actionBtn.disabled = false;
    cancelBtn.disabled = false;
  }
}

function clearProfileCompletionState() {
  localStorage.removeItem("solverProfileCompleted");
  localStorage.removeItem(`solverProfileCompleted:${accountId}`);
}

function markProfileCompleted() {
  localStorage.setItem(
    `solverProfileCompleted:${accountId}`,
    "true"
  );

  // Keep compatibility with existing frontend navigation.
  localStorage.setItem(
    "solverProfileCompleted",
    "true"
  );
}

function resetProfileForm() {

  fullNameInput.value = "";
  profileLocationInput.value = "";
  linkedinInput.value = "";
  aboutInput.value = "";
  consentInput.checked = false;

  roleInputs.forEach(input => {
    input.value = "";
  });

  profilePhotoData = "";
  profilePhone = account.phone || "";

  profilePhoto.style.backgroundImage = "";
  profilePhoto.classList.remove("has-photo");

  updateMiniProfile();
  aboutInput.dispatchEvent(new Event("input"));
  updateSkillsList();
  document.querySelectorAll("[data-category-select]").forEach(updateCategorySelect);
}

function parseProjectData(projects) {
  if (!projects) {
    return {
      extraData: {},
      isEnvelope: false,
      legacyProjects: ""
    };
  }

  try {
    const parsed = JSON.parse(projects);

    if (
      parsed &&
      typeof parsed === "object" &&
      !Array.isArray(parsed)
    ) {
      return {
        extraData: parsed,
        isEnvelope: true,
        legacyProjects: ""
      };
    }
  } catch {
    // Legacy plain-text project data.
  }

  return {
    extraData: {},
    isEnvelope: false,
    legacyProjects: projects
  };
}

function applyProfile(profile) {

  const saved = profile || {};
  backendProfileSnapshot = { ...saved };

  /*
   * Backend fields are the source of truth.
   * Account data is only used as a fallback for fields
   * that the current profile request does not contain.
   */
  fullNameInput.value =
    saved.full_name || account.primaryName || "";

  profilePhone =
    saved.phone || account.phone || "";

  const university =
    saved.university || "";

  const enrollmentId =
    saved.enrollment_id || "";

  const department =
    saved.department || "";

  const yearOfStudy =
    saved.year_of_study || "";

  const skills =
    saved.skills || "";

  const interests =
    saved.interests || "";

  const {
    extraData,
    isEnvelope,
    legacyProjects
  } = parseProjectData(saved.projects);

  profileLocationInput.value =
    extraData.location || "";

  linkedinInput.value =
    extraData.linkedin || "";

  aboutInput.value =
    extraData.about || "";

  consentInput.checked =
    !!extraData.consent;

  profilePhotoData =
    extraData.photo || "";

  const savedRoleFields =
    Array.isArray(extraData.roleFields)
      ? extraData.roleFields
      : [];

  roleInputs.forEach(input => {

    const label = input.dataset.label;

    const savedField =
      savedRoleFields.find(
        field => field && field.label === label
      );

    if (savedField) {
      input.value = savedField.value || "";
      return;
    }

    /*
     * Restore structured backend fields for profiles
     * created before the JSON envelope was introduced.
     */
    if (label === "University / HEI Name") {
      input.value = university;
    } else if (
      label === "Enrollment / Student ID" ||
      label === "Researcher / Employee ID"
    ) {
      input.value = enrollmentId;
    } else if (label === "Department / Branch") {
      input.value = department;
    } else if (label === "Year of Study") {
      input.value = yearOfStudy;
    } else if (label === "Skills") {
      input.value = skills;
    } else if (label === "Interests") {
      input.value = interests;
    } else if (
      label === "Projects (Optional)" &&
      !isEnvelope
    ) {
      input.value = legacyProjects;
    }

  });

  document.querySelectorAll("[data-category-select]").forEach(updateCategorySelect);

  if (profilePhotoData) {

    profilePhoto.style.backgroundImage =
      `url("${profilePhotoData}")`;

    profilePhoto.classList.add("has-photo");

  } else {

    profilePhoto.style.backgroundImage = "";
    profilePhoto.classList.remove("has-photo");

  }

  updateMiniProfile();
  aboutInput.dispatchEvent(new Event("input"));
  updateSkillsList();
}

async function loadProfile() {

  if (!isValidAccountId) return;

  setProfileCardLoading(true);

  /*
   * Never display another user's cached profile while the
   * current account's backend profile is being fetched.
   */
  resetProfileForm();
  backendProfileSnapshot = {};
  clearProfileCompletionState();
  hasLoadedProfile = false;
  setEditing(false);

  try {

    const response =
      await fetch(
        `${API_BASE}/api/solver/profile/${encodeURIComponent(accountId)}`,
        {
          method: "GET",
          headers: {
            "Accept": "application/json"
          },
          cache: "no-store"
        }
      );

    if (response.ok) {

      const profile =
        await response.json();

      applyProfile(profile);

      hasLoadedProfile = true;
      markProfileCompleted();

      setEditing(false);

      return;
    }

    if (response.status === 404) {

      resetProfileForm();

      hasLoadedProfile = false;
      clearProfileCompletionState();

      setEditing(true);

      return;
    }

    let errorMessage =
      "Unable to load your profile.";

    try {
      const errorResult = await response.json();

      errorMessage =
        errorResult.error ||
        errorResult.message ||
        errorMessage;
    } catch {
      // Ignore non-JSON error responses.
    }

    throw new Error(errorMessage);

  } catch (error) {

    console.error(
      "Profile load error:",
      error
    );

    resetProfileForm();
    hasLoadedProfile = false;
    clearProfileCompletionState();

    setEditing(true);

    alert(
      error.message ||
      "Could not connect to the server. Please make sure the backend is running and try again."
    );

  } finally {

    setProfileCardLoading(false);
  }
}

function setEditing(editing) {

  isEditing = editing;

  profileCard.classList.toggle(
    "profile-readonly",
    !editing
  );

  [
    fullNameInput,
    profileLocationInput,
    linkedinInput,
    aboutInput,
    ...roleInputs
  ].forEach(input => {
    input.readOnly = !editing;
  });

  consentInput.disabled = !editing;
  photoInput.disabled = !editing;
  uploadPhotoBtn.disabled = !editing;
  closeCategorySelects();

  document.querySelectorAll("[data-category-select]").forEach(select => {
    select.querySelector(".category-select-trigger").disabled = !editing;
  });

  cancelBtn.style.display =
    editing && hasLoadedProfile
      ? "inline-flex"
      : "none";

  if (!editing) {

    pageTitle.textContent =
      "Your Profile";

    actionBtn.innerHTML =
      '<i class="fa-regular fa-pen-to-square"></i> Edit Profile';

  } else if (hasLoadedProfile) {

    pageTitle.textContent =
      "Edit Profile";

    actionBtn.innerHTML =
      '<i class="fa-regular fa-floppy-disk"></i> Update Profile';

  } else {

    pageTitle.textContent =
      "Create Profile";

    actionBtn.innerHTML =
      '<i class="fa-regular fa-floppy-disk"></i> Save Profile';
  }
}

function getRoleField(label) {

  const input =
    roleInputs.find(
      item => item.dataset.label === label
    );

  return input
    ? input.value.trim()
    : "";
}

function buildProfilePayload() {

  /*
   * Keep the structured fields that the current
   * backend SolverProfileRequest supports.
   */
  const university =
    getRoleField("University / HEI Name");

  const enrollmentId =
    getRoleField("Enrollment / Student ID") ||
    getRoleField("Researcher / Employee ID");

  const departmentField =
    getRoleField("Department / Branch");

  const yearOfStudyField =
    getRoleField("Year of Study");

  const skillsField =
    getRoleField("Skills");

  const interestsField =
    getRoleField("Interests") ||
    getRoleField("Research Interests");

  /*
   * Some roles do not expose all of the structured
   * backend fields in their current UI. Preserve those
   * existing backend values instead of replacing them
   * with blanks during an edit.
   */
  const department =
    departmentField ||
    backendProfileSnapshot.department ||
    "";

  const yearOfStudy =
    yearOfStudyField ||
    backendProfileSnapshot.year_of_study ||
    "";

  const skills =
    skillsField ||
    backendProfileSnapshot.skills ||
    "";

  const interests =
    interestsField ||
    backendProfileSnapshot.interests ||
    "";

  /*
   * The current database schema has a single
   * projects TEXT column. Store frontend-specific
   * fields here as JSON so they are not lost.
   */
  const profileExtras = {

    version: 1,

    location:
      profileLocationInput.value.trim(),

    linkedin:
      linkedinInput.value.trim(),

    about:
      aboutInput.value.trim(),

    consent:
      isStudentResearcher
        ? consentInput.checked
        : false,

    photo:
      profilePhotoData,

    roleFields:
      roleInputs.map(input => ({
        label:
          input.dataset.label,
        value:
          input.value.trim()
      }))

  };

  return {

    full_name:
      fullNameInput.value.trim(),

    phone:
      profilePhone,

    university:
      university,

    enrollment_id:
      enrollmentId,

    department:
      department,

    year_of_study:
      yearOfStudy,

    skills:
      skills,

    interests:
      interests,

    projects:
      JSON.stringify(profileExtras)

  };
}

function validateProfile() {

  if (
    !fullNameInput.value.trim() ||
    !profileLocationInput.value.trim() ||
    !aboutInput.value.trim()
  ) {

    alert(
      "Please complete Full Name, Location and Bio."
    );

    return false;
  }

  const missing =
    roleInputs.find(
      input =>
        !input.dataset.label.includes("Optional") &&
        !input.value.trim()
    );

  if (missing) {

    alert(
      `Please complete: ${missing.dataset.label}`
    );

    missing.focus();

    return false;
  }

  return true;
}

async function saveProfile() {

  if (isLoadingProfile) return;
  if (!isValidAccountId) return;
  if (!validateProfile()) return;

  const wasExistingProfile =
    hasLoadedProfile;

  const payload =
    buildProfilePayload();

  actionBtn.disabled = true;

  actionBtn.innerHTML =
    '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

  try {

    const response =
      await fetch(
        `${API_BASE}/api/solver/profile/${encodeURIComponent(accountId)}`,
        {
          method: wasExistingProfile
            ? "PUT"
            : "POST",

          headers: {
            "Content-Type":
              "application/json",
            "Accept":
              "application/json"
          },

          body:
            JSON.stringify(payload)
        }
      );

    const responseText =
      await response.text();

    let result = {};

    try {
      result = responseText
        ? JSON.parse(responseText)
        : {};
    } catch {
      result = {};
    }

    if (!response.ok) {

      throw new Error(
        result.error ||
        result.message ||
        responseText ||
        "Failed to save profile."
      );
    }

    /*
     * The write succeeded. Now verify the exact same
     * account's profile from the backend.
     */
    const profileResponse =
      await fetch(
        `${API_BASE}/api/solver/profile/${encodeURIComponent(accountId)}`,
        {
          method: "GET",
          headers: {
            "Accept": "application/json"
          },
          cache: "no-store"
        }
      );

    if (!profileResponse.ok) {

      let verificationMessage =
        "Profile was saved, but verification failed.";

      try {
        const verificationError =
          await profileResponse.json();

        verificationMessage =
          verificationError.error ||
          verificationError.message ||
          verificationMessage;
      } catch {
        // Keep the verification message above.
      }

      throw new Error(
        `${verificationMessage} Please reload the page to verify the saved profile.`
      );
    }

    const savedProfile =
      await profileResponse.json();

    applyProfile(savedProfile);

    hasLoadedProfile = true;
    markProfileCompleted();

    setEditing(false);

    alert(
      wasExistingProfile
        ? "Profile updated successfully!"
        : "Profile saved successfully!"
    );

  } catch (error) {

    console.error(
      "Profile save error:",
      error
    );

    alert(
      error.message ||
      "Failed to save profile. Please try again."
    );

    setEditing(true);

  } finally {

    actionBtn.disabled = false;

    if (isEditing) {

      actionBtn.innerHTML =
        hasLoadedProfile
          ? '<i class="fa-regular fa-floppy-disk"></i> Update Profile'
          : '<i class="fa-regular fa-floppy-disk"></i> Save Profile';

    }
  }
}

uploadPhotoBtn.addEventListener(
  "click",
  () => photoInput.click()
);

photoInput.addEventListener(
  "change",
  () => {

    const file =
      photoInput.files[0];

    if (!file) return;

    if (
      !["image/png", "image/jpeg"]
        .includes(file.type)
    ) {

      alert(
        "Please select a JPG or PNG image."
      );

      photoInput.value = "";

      return;
    }

    if (file.size > 1000000) {

      alert(
        "For this frontend demo, please use an image smaller than 1 MB."
      );

      photoInput.value = "";

      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      event => {

        profilePhotoData =
          event.target.result;

        profilePhoto.style.backgroundImage =
          `url("${profilePhotoData}")`;

        profilePhoto.classList.add(
          "has-photo"
        );
      };

    reader.onerror =
      () => alert(
        "Could not read that image. Please try another file."
      );

    reader.readAsDataURL(file);
  }
);

actionBtn.addEventListener(
  "click",
  () => {

    if (isLoadingProfile) return;

    if (!isEditing) {

      setEditing(true);

      return;
    }

    saveProfile();
  }
);

cancelBtn.addEventListener(
  "click",
  () => {

    if (isLoadingProfile) return;

    loadProfile();
  }
);

// Sidebar collapse.
sidebarToggle.addEventListener(
  "click",
  () => {

    sidebar.classList.toggle("collapsed");

    document
      .querySelector(".profile-app")
      .classList.toggle(
        "sidebar-collapsed"
      );

    sidebarToggle.querySelector("i")
      .className =
        sidebar.classList.contains("collapsed")
          ? "fa-solid fa-angles-right"
          : "fa-solid fa-angles-left";
  }
);

// Scroll tabs.
const tabs =
  [...document.querySelectorAll(".tab")];

const sections =
  tabs.map(
    tab =>
      document.getElementById(
        tab.dataset.target
      )
  );

tabs.forEach(
  tab =>
    tab.addEventListener(
      "click",
      () =>
        document
          .getElementById(
            tab.dataset.target
          )
          .scrollIntoView({
            behavior: "smooth",
            block: "start"
          })
    )
);

window.addEventListener(
  "scroll",
  () => {

    let current =
      sections[0].id;

    sections.forEach(
      section => {

        if (
          section.getBoundingClientRect().top <= 150
        ) {
          current = section.id;
        }

      }
    );

    tabs.forEach(
      tab =>
        tab.classList.toggle(
          "active",
          tab.dataset.target === current
        )
    );
  }
);

function setRoleAwareNavigation() {

  const matchesLink =
    document.getElementById(
      "aiMatchesNav"
    );

  if (!matchesLink) return;

  matchesLink.href =
    role === "student" ||
    role === "researcher"
      ? "ai-matches-student.html"
      : "ai-matches-industry.html";
}

setRoleAwareNavigation();

setProfileCardLoading(true);
loadProfile();
</script>
