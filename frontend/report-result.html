<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Result | JAN SETU</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="brand">
        <img src="assets/jansetu-logo.jpg" alt="JAN SETU Logo">
    </a>
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="#">About</a>
        <a href="#">Initiatives</a>
        <a href="#">Explore Jharkhand</a>
        <a href="#">Stories</a>
        <a href="#">Resources</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main class="result-page">
    <div class="result-card" id="resultCard">
        <div class="result-icon" id="resultIcon">✓</div>

        <h1 id="resultTitle">Problem Accepted!</h1>
        <p class="result-message" id="resultMessage"></p>

        <div class="problem-id-box" id="problemIdBox">
            <span>Problem ID</span>
            <strong id="problemId"></strong>
        </div>

        <div class="result-info" id="resultInfo"></div>

        <div class="result-actions">
            <button class="result-primary" id="primaryBtn"></button>
            <a href="index.html" class="result-secondary">Back to Home</a>
        </div>
    </div>
</main>

<div class="result-landscape"></div>

<script>
// Use: ?status=accepted | ?status=review | ?status=declined
const params = new URLSearchParams(window.location.search);
const status = params.get("status") || "accepted";

const card = document.getElementById("resultCard");
const icon = document.getElementById("resultIcon");
const title = document.getElementById("resultTitle");
const message = document.getElementById("resultMessage");
const idBox = document.getElementById("problemIdBox");
const problemId = document.getElementById("problemId");
const info = document.getElementById("resultInfo");
const primaryBtn = document.getElementById("primaryBtn");

if (status === "accepted") {
    card.classList.add("accepted");

    title.textContent = "Problem Accepted!";
    message.textContent =
        "Your report has been successfully verified by JAN SETU.";

    // Generate ID only after acceptance
    let savedId = localStorage.getItem("problemId");

    if (!savedId) {
        savedId =
            "JS-2026-" + Math.floor(1000 + Math.random() * 9000);

        localStorage.setItem("problemId", savedId);
    }

    problemId.textContent = savedId;

    info.innerHTML =
        "<strong>Student matching will begin shortly.</strong><br>" +
        "Suitable students will be notified based on the required skills.";

    primaryBtn.textContent = "Track Problem";

    // Open citizen tracking page
    primaryBtn.onclick = function () {
        window.location.href = "track-problem-final.html";
    };
}

else if (status === "review") {
    card.classList.add("review");

    icon.textContent = "!";
    title.textContent = "Needs Review";
    message.textContent =
        "Your report has been sent to an Authority Reviewer for further verification.";

    idBox.style.display = "none";

    info.innerHTML =
        "<strong>Under Review</strong><br>" +
        "You will be notified once the review is completed.";

    primaryBtn.textContent = "View Status";
}

else {
    card.classList.add("declined");

    icon.textContent = "×";
    title.textContent = "Report Could Not Be Accepted";
    message.textContent =
        "We are unable to accept this report at the moment.";

    idBox.style.display = "none";

    info.innerHTML =
        "<strong>Reason:</strong><br>" +
        "A similar report may already exist or more details may be required.";

    primaryBtn.textContent = "Edit & Resubmit";

    primaryBtn.onclick = function () {
        window.location.href = "report.html";
    };
}
</script>

</body>
</html>
