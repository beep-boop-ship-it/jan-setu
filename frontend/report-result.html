<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Result | JAN SETU</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="brand">
        <img src="assets/jansetu-logo.jpg" alt="JAN SETU Logo">
    </a>
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="problems.html">List of Problems</a>
        <a href="index.html#about">About</a>
        <a href="index.html#initiatives">Initiatives</a>
        <a href="index.html#explore">Explore Jharkhand</a>
        <a href="index.html#stories">Stories</a>
        <a href="index.html#resources">Resources</a>
        <a href="index.html#contact">Contact</a>
    </nav>
</header>

<main class="result-page">
    <div class="result-card" id="resultCard">
        <div class="result-icon" id="resultIcon">✓</div>

        <h1 id="resultTitle">Problem Submitted!</h1>
        <p class="result-message" id="resultMessage"></p>

        <div class="problem-id-box" id="problemIdBox">
            <span>Problem ID</span>
            <strong id="problemId"></strong>
        </div>

        <div class="result-info" id="resultInfo"></div>

        <div class="result-actions">
            <button class="result-primary" id="primaryBtn" type="button"></button>
            <a href="index.html" class="result-secondary">Back to Home</a>
        </div>
    </div>
</main>

<div class="result-landscape"></div>

<script>
const params = new URLSearchParams(window.location.search);
const status = (params.get("status") || "submitted").toLowerCase();
const reportId = params.get("id");

const card = document.getElementById("resultCard");
const icon = document.getElementById("resultIcon");
const title = document.getElementById("resultTitle");
const message = document.getElementById("resultMessage");
const idBox = document.getElementById("problemIdBox");
const problemId = document.getElementById("problemId");
const info = document.getElementById("resultInfo");
const primaryBtn = document.getElementById("primaryBtn");

if (status === "submitted" || status === "accepted") {
    card.classList.add("accepted");

    title.textContent = "Problem Submitted!";
    message.textContent =
        "Your report has been successfully submitted to JAN SETU.";

    const trackId = sessionStorage.getItem("newReportTrackId");

    if (trackId && reportId && /^\d+$/.test(reportId)) {

        problemId.textContent = trackId;

        localStorage.setItem("problemId", trackId);
        localStorage.setItem("activeTrackProblemId", reportId);

        info.innerHTML =
            "<strong>Your problem has been recorded.</strong><br>" +
            "Keep this Track ID safe. You will need it to track your problem.";

        primaryBtn.textContent = "Track Problem";
        primaryBtn.onclick = () => {
            window.location.href =
                `track-problem-final.html?id=${encodeURIComponent(reportId)}`;
        };

        sessionStorage.removeItem("newReportTrackId");

    } else {
        idBox.style.display = "none";

        info.innerHTML =
            "<strong>Your report was submitted.</strong><br>" +
            "Your Track ID could not be retrieved. Please try tracking it later.";

        primaryBtn.textContent = "View Problems";
        primaryBtn.onclick = () => {
            window.location.href = "problems.html";
        };
    }

} else if (status === "review") {
    card.classList.add("review");

    icon.textContent = "!";
    title.textContent = "Needs Review";
    message.textContent =
        "Your report has been sent to an Authority Reviewer for further verification.";

    idBox.style.display = "none";

    info.innerHTML =
        "<strong>Under Review</strong><br>" +
        "No public Problem ID is created until the report is approved.";

    primaryBtn.textContent = "Back to Report";
    primaryBtn.onclick = () => {
        window.location.href = "report.html";
    };

} else {
    card.classList.add("declined");

    icon.textContent = "×";
    title.textContent = "Report Could Not Be Accepted";
    message.textContent =
        "We are unable to accept this report at the moment.";

    idBox.style.display = "none";

    info.innerHTML =
        "<strong>Reason:</strong><br>" +
        "A similar report may already exist or more details may be required.";

    primaryBtn.textContent = "Edit & Resubmit";
    primaryBtn.onclick = () => {
        window.location.href = "report.html";
    };
}
</script>

</body>
</html>
